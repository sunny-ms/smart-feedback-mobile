<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Feedback</title>
</head>
<body style="font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 0 16px; color: #334155; text-align: center;">
  <div>
    <h1 style="font-size: 1.25rem;">Can't reach Smart Feedback</h1>
    <p style="color: #64748b;">Check your internet connection and try again.</p>
    <button onclick="location.replace('https://smartfeedback.evalora.tech')"
      style="margin-top: 8px; padding: 12px 20px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 1rem;">
      Try again
    </button>
  </div>
</body>
</html>
