name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      # The Android project is generated on every build (android/ isn't committed).
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set version
        run: |
          v="0.2.${{ github.run_number }}"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$v\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Release key from GitHub Secrets (the only other copy is on the dev laptop,
      # in ~/.smart-feedback-keys). Every APK must be signed with it, or phones
      # refuse to update the installed app.
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          "$apksigner" verify --print-certs "$apk" | grep -q "CN=Smart Feedback" || { echo "Not signed with the release key"; exit 1; }
          cp "$apk" smart-feedback.apk

      # A normal (not pre-) release, so /releases/latest/download/smart-feedback.apk
      # always points at the newest build.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" smart-feedback.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Smart Feedback $APP_VERSION (beta)" \
            --notes "Beta build from commit ${GITHUB_SHA::7}. On an Android phone: download smart-feedback.apk, open it, and allow installing from this source if asked."
